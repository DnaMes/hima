name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-and-package:
    name: Validate and package source release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag against package.json and ensure on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG#v}" != "${version}" ]]; then
            echo "tag ${RELEASE_TAG} does not match package.json version ${version}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tagged commit ${GITHUB_SHA} is not merged into origin/main" >&2
            exit 1
          fi

      - name: Install, typecheck, build and test
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Build source archive and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist-release
          git archive --format=tar.gz --prefix="hima-${version}/" "$GITHUB_SHA" > "dist-release/hima-${version}.tar.gz"
          (cd dist-release && sha256sum "hima-${version}.tar.gz" > SHA256SUMS)

      - name: Prepare release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v v="## [$version]" -v v2="## $version " -v v3="## $version" '
            index($0, v) == 1 || index($0, v2) == 1 || $0 == v3 {found=1; next}
            found && /^## / {exit}
            found
          ' CHANGELOG.md > dist-release/RELEASE_NOTES.md
          test -s dist-release/RELEASE_NOTES.md || { echo "no CHANGELOG section for ${version}" >&2; exit 1; }

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            "dist-release/hima-${version}.tar.gz" dist-release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Hima ${version}" \
            --notes-file dist-release/RELEASE_NOTES.md
